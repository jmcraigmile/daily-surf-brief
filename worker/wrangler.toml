name = "greenflash-trigger"
main = "index.js"
compatibility_date = "2026-10-01"
workers_dev = false

# ONE cron trigger -- the Workers Free plan allows five per account. It fires
# at :07, :17 and :27 every hour (72 times a day, trivially within free
# limits) and index.js dispatches only at Pacific 6:07, 15:17 and 21:27.
# Those are the same minutes as .github/workflows/publish.yml; test_brief.py
# keeps them in sync. DST needs no handling: the Worker reads Pacific time.
[triggers]
crons = ["7,17,27 * * * *"]

[observability]
enabled = true

# Secret (never in this file): GITHUB_TOKEN -- a fine-grained PAT scoped to
# jmcraigmile/daily-surf-brief with Actions: read and write.
#   cd 05-Daily/worker && npx wrangler@4 secret put GITHUB_TOKEN
