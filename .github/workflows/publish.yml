# Builds and publishes the daily surf brief to GitHub Pages.
#
# THIS RUNS ON GITHUB'S SERVERS, NOT ON A LAPTOP. Nothing here depends on any
# machine of Jake's being awake, online, or switched on.
#
# Three publishes a day (2026-08-31, was two), each scheduled at BOTH possible
# UTC offsets so the local time holds across DST. The off-offset run is
# harmless -- it just rebuilds an hour early or late, and the hour-of-day logic
# below still classifies it correctly:
#
#   local   role                        PDT cron    PST cron
#   6am     today, both windows         13:07 UTC   14:07 UTC
#   3pm     today, EVENING WINDOW ONLY  22:17 UTC   23:17 UTC
#   9pm     tomorrow, both windows      04:27 UTC   05:27 UTC
#
# The 3pm run drops the dawn patrol on purpose: by mid-afternoon that session
# has already happened, and a passed call sitting next to a live one is exactly
# the sort of thing that gets misread at a glance. What's left is the single
# live question -- is the sunset session worth it.
#
# ---------------------------------------------------------------------------
# WHY THE ODD MINUTES (:07 / :17 / :27), measured 2026-08-31
#
# GitHub runs scheduled workflows on a BEST-EFFORT basis and queues them behind
# everyone else's. Measured across this repo's first seven scheduled runs, every
# single one was late -- median 5h54m, range 3h43m to 6h24m, and one slot was
# skipped outright. The top of the hour is the most contended minute on that
# queue, and the two least-delayed runs in that sample were the ones at :45.
#
# So: never schedule at :00 here. These crons sit at odd minutes, staggered, to
# stay out of the stampede. This is a mitigation, not a fix -- if the lag stays
# at hours rather than minutes, the real answer is an external punctual trigger
# (a Cloudflare Worker cron calling the workflow_dispatch API) rather than
# GitHub's own scheduler. Check the delay before assuming this worked.
#
# The saving grace is that ROLE IS KEYED ON THE ACTUAL LOCAL HOUR at run time,
# not on which cron fired -- so a run that lands hours late still produces a
# brief appropriate to when it actually ran. Late, never wrong.
# ---------------------------------------------------------------------------
#
# Failure behaviour is deliberate: if Open-Meteo or NOAA is down after retries,
# the run fails loudly (GitHub emails on workflow failure) and the last good
# page stays up -- its generated-at line in the header is the staleness signal.

name: publish-brief

on:
  schedule:
    - cron: "7 13 * * *"    # 6:07am PDT
    - cron: "7 14 * * *"    # 6:07am PST
    - cron: "17 22 * * *"   # 3:17pm PDT
    - cron: "17 23 * * *"   # 3:17pm PST
    - cron: "27 4 * * *"    # 9:27pm PDT (previous local day)
    - cron: "27 5 * * *"    # 9:27pm PST (previous local day)
  # A push to main republishes immediately. Without this, a change sat unbuilt
  # until the next cron -- which, given the queue delay above, meant hours of
  # staring at a page that predated the commit and wondering what broke.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      # The runner is UTC; the brief's generated-at stamp is the staleness
      # signal and must read in local time.
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v4

      - name: Run invariant tests
        run: python3 test_brief.py

      - name: Fetch, score, render
        run: |
          # Three roles, keyed on local hour. The bands are wide enough that
          # the off-DST-offset run (±1h) still lands in the right one.
          #   <12   -> today, both windows        (the 6am run, and its 5/7am twin)
          #   12-17 -> today, evening window only (the 3pm run, and its 2/4pm twin)
          #   >=18  -> tomorrow, both windows     (the 9pm run, and its 8/10pm twin)
          HOUR=$(TZ=America/Los_Angeles date +%H)
          HOUR=$((10#$HOUR))          # strip the leading zero: 08 is not octal here
          ONLY=""
          if [ "$HOUR" -ge 18 ]; then
            TARGET=$(TZ=America/Los_Angeles date -d tomorrow +%F)
            ROLE="night-before"
          elif [ "$HOUR" -ge 12 ]; then
            TARGET=$(TZ=America/Los_Angeles date +%F)
            ONLY="--only-window evening"
            ROLE="afternoon (evening window only)"
          else
            TARGET=$(TZ=America/Los_Angeles date +%F)
            ROLE="day-of"
          fi
          echo "building brief for $TARGET -- $ROLE (local hour $HOUR)"
          python3 surf_forecast.py --date "$TARGET" $ONLY --json brief.json \
            || { echo "first attempt failed, retrying in 60s"; sleep 60; \
                 python3 surf_forecast.py --date "$TARGET" $ONLY --json brief.json; }
          mkdir -p site
          python3 render.py brief.json site/index.html
          python3 render.py --breaks breaks.json site/breaks.html
          python3 render.py --quiver boards.json site/quiver.html
          cp -r assets site/assets

      - name: 5-day outlook (non-fatal -- the daily brief publishes regardless)
        run: |
          if python3 surf_forecast.py --outlook 5 --json outlook.json \
             && python3 render.py --outlook outlook.json site/outlook.html \
             && ! grep -q "None" site/outlook.html; then
            echo "outlook built"
          else
            printf '%s' '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>greenflash outlook</title></head><body style="font-family:system-ui;padding:2rem;background:#0b1418;color:#e8f1f5"><p>Outlook unavailable this run &mdash; <a style="color:#5cb6e8" href="./">back to today&#39;s brief</a>.</p></body></html>' > site/outlook.html
            echo "::warning::outlook failed; wrote fallback page"
          fi

      - name: Guard against leaked nulls
        run: |
          if grep -q "None" site/index.html; then
            echo "::error::'None' leaked into the rendered page"; exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
